spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/portalincluir}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:12345}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#Cria pasta para upload de arquivos
file.upload-dir=uploads

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# JWT stateless. Em producao, defina JWT_SECRET no ambiente.
jwt.secret=${JWT_SECRET:dev-finaliza-tcc-change-this-secret-32-bytes-minimum}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Swagger
springdoc.swagger-ui.path=/


# Preserva dados e vinculos das revisoes de exclusao para descarte por estudante.
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.default_schema=auditoria
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
# Migra as tabelas existentes antes de o Hibernate atualizar o mapeamento.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/auditoria-schema.sql
spring.sql.init.separator=^^^
# Consultas de revisoes exigem habilitacao explicita em ambiente com acesso controlado.
app.historico.consulta-habilitada=${HISTORICO_CONSULTA_HABILITADA:false}
app.retencao.intervalo-ms=${RETENCAO_INTERVALO_MS:3600000}
app.retencao.tamanho-lote=100
